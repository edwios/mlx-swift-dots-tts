[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-interactive"
version = "0.1.0"
description = "OpenClaw agent + Qwen3-TTS (mlx-audio) voice CLI for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-audio[tts]>=0.4.5",
    "textual>=0.60",
]

[project.scripts]
oc-interactive = "oc_interactive.cli:main"
oc-interactive-chat = "oc_interactive.chat_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oc_interactive*"]
